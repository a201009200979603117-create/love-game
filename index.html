
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#151525">
    <title>心動的每一天</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==============================
         主選單
    ============================== -->
    <div id="menu">
        <div class="menu-overlay">
            <p class="menu-subtitle">MY YOUTH, MY STORY</p>

            <h1 class="menu-title">心動的每一天</h1>

            <p class="menu-description">
                有些相遇，會讓平凡的日子變得特別。
                <br>
                你的青春故事，從這裡開始。
            </p>

            <button id="start-button" onclick="startGame()">
                開始故事　→
            </button>
        </div>
    </div>


    <!-- ==============================
         遊戲主畫面
    ============================== -->
    <main id="game" style="display: none;">

        <!-- 左上角操作按鈕 -->
        <div id="game-toolbar">
            <button
                id="restart-button"
                onclick="restartGame()"
            >
                重新開始
            </button>

            <button
                id="settings-button"
                onclick="toggleSettings(true)"
                aria-label="開啟遊戲設定"
            >
                ⚙ 設定
            </button>
        </div>


        <!-- 女主角 -->
        <div id="character-area">
            <img
                id="character-image"
                src="images/heroine.png"
                alt="女主角"
            >
        </div>


        <!-- 劇情對話 -->
        <section id="dialogue-box">
            <h3 id="character-name">旁白</h3>

            <p id="dialogue">
                你走進教室，發現一位陌生的女孩坐在窗邊。
            </p>

            <div id="scene-progress">
                第 1 / 20 段
            </div>
        </section>


        <!-- 好感度系統 -->
        <section id="affection-panel">
            <p id="affection">好感度：0 / 100</p>

            <p id="affection-level">關係：陌生人</p>

            <div id="affection-bar">
                <div id="affection-fill"></div>
            </div>
        </section>


        <!-- 劇情選項由 script.js 自動建立 -->
        <div id="story-choices" style="display: none;"></div>


        <!-- 下一段劇情 -->
        <button
            id="next-button"
            onclick="nextDialogue()"
        >
            下一段 ▶
        </button>


        <!-- ==============================
             遊戲設定視窗
        ============================== -->
        <div
            id="settings-overlay"
            style="display: none;"
            role="dialog"
            aria-modal="true"
            aria-labelledby="settings-title"
        >
            <section id="settings-panel">

                <div id="settings-header">
                    <div>
                        <p class="settings-subtitle">
                            GAME PREFERENCES
                        </p>

                        <h2 id="settings-title">
                            遊戲設定
                        </h2>
                    </div>

                    <button
                        id="settings-close"
                        onclick="toggleSettings(false)"
                        aria-label="關閉設定"
                    >
                        ✕
                    </button>
                </div>


                <!-- 文字速度 -->
                <div class="setting-item">
                    <div class="setting-label-row">
                        <label for="text-speed">
                            文字顯示速度
                        </label>

                        <span id="text-speed-value">
                            普通
                        </span>
                    </div>

                    <input
                        type="range"
                        id="text-speed"
                        min="1"
                        max="5"
                        value="3"
                        step="1"
                    >

                    <p class="setting-description">
                        調整劇情文字出現的速度。
                    </p>
                </div>


                <!-- 背景音樂音量 -->
                <div class="setting-item">
                    <div class="setting-label-row">
                        <label for="music-volume">
                            背景音樂
                        </label>

                        <span id="music-volume-value">
                            50%
                        </span>
                    </div>

                    <input
                        type="range"
                        id="music-volume"
                        min="0"
                        max="100"
                        value="50"
                        step="5"
                    >

                    <p class="setting-description">
                        調整背景音樂音量。
                    </p>
                </div>


                <!-- 音效音量 -->
                <div class="setting-item">
                    <div class="setting-label-row">
                        <label for="sfx-volume">
                            遊戲音效
                        </label>

                        <span id="sfx-volume-value">
                            70%
                        </span>
                    </div>

                    <input
                        type="range"
                        id="sfx-volume"
                        min="0"
                        max="100"
                        value="70"
                        step="5"
                    >

                    <p class="setting-description">
                        調整按鈕與劇情音效音量。
                    </p>
                </div>


                <!-- 逐字顯示 -->
                <div class="setting-item setting-toggle-row">
                    <div>
                        <label for="typewriter-toggle">
                            逐字顯示
                        </label>

                        <p class="setting-description">
                            關閉後直接顯示完整對話。
                        </p>
                    </div>

                    <input
                        type="checkbox"
                        id="typewriter-toggle"
                        checked
                    >
                </div>


                <!-- 全螢幕 -->
                <button
                    id="fullscreen-button"
                    onclick="toggleFullscreen()"
                >
                    ⛶ 切換全螢幕
                </button>


                <!-- 關閉設定 -->
                <button
                    id="settings-done"
                    onclick="toggleSettings(false)"
                >
                    完成設定
                </button>

            </section>
        </div>


        <!-- ==============================
             結局 CG
        ============================== -->
        <div
            id="ending-cg"
            style="display: none;"
            onclick="advanceEndingCG()"
        >
            <img
                id="ending-cg-image"
                src=""
                alt="結局專屬插畫"
            >

            <div id="ending-dialogue-box">
                <h3 id="ending-cg-title">故事結局</h3>

                <p id="ending-cg-dialogue">
                    點擊畫面，揭開故事結局……
                </p>

                <span id="ending-cg-hint">
                    點擊畫面繼續 ▶
                </span>
            </div>
        </div>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
